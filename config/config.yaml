# Central configuration. Model names live here (never in code) because providers
# retire models. Secrets are NOT stored here; see .env.example.

app:
  title: ClassCritique
  subtitle: Upload a class recording or paste a link to get a quality label with timestamped evidence.

provider: groq            # organiser-approved hosted provider; env PROVIDER overrides. "groq" | "local"

media:
  allowed_extensions: [".mp4", ".mkv", ".mov", ".webm", ".m4a", ".mp3", ".wav"]
  max_upload_mb: 1024
  min_duration_s: 30       # shorter clips are rejected: too little to assess
  max_duration_s: 7200     # 2 hours
  sample_rate: 16000
  chunk_target_s: 600      # ~10 min chunks
  chunk_min_s: 10          # a trailing chunk shorter than this is folded into the previous one
  chunk_max_mb: 24         # hard API limit is 25 MB; keep a margin

transcription:
  language: null           # auto-detect: classes may be in Malayalam, Hindi, French, ... (or "en" to force)
  # If the hosted call fails after retries, transcribe that chunk locally (slow on CPU,
  # downloads a ~500 MB model on first use). Off: Groq-only setup, failures surface as errors.
  fallback_to_local: false
  # Whisper hallucination guard: segments matching these are flagged and not used as evidence
  flag_no_speech_prob: 0.6
  flag_avg_logprob: -1.0
  flag_compression_ratio: 2.4
  groq:
    # Not -turbo: on a Malayalam class turbo mis-detected English and output English-like text,
    # while large-v3 detected Malayalam with clearly higher confidence (see docs/ai_interaction_log.md).
    model: whisper-large-v3
  local:
    model: small
    device: cpu
    compute_type: int8
    vad_filter: true

models:                    # local model files, fetched on first use and checked by sha256
  speaker_embedding:
    path: models/wespeaker_en_voxceleb_resnet34_LM.onnx
    url: https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx
    sha256: e9848563da86f263117134dfd7ad63c92355b37de492b55e325400c9d9c39012

speakers:
  window_s: 1.5            # embedding window
  step_s: 0.75
  min_region_s: 0.5        # speech regions shorter than this are ignored
  cluster_threshold: 0.35  # cosine distance; best mean balanced accuracy (0.70) over 12 VTT-checked recordings (scripts/check_speakers.py)
  teacher_min_fraction: 0.6   # segment is "teacher" if >= this much of it overlaps teacher windows
  student_max_fraction: 0.4   # "student" if <= this; in between = "mixed"

visual:
  enabled: true
  interval_s: 45             # one frame per 45 s: sparse samples, never "continuous observation"
  max_frames: 120
  frame_width: 960           # frames are downscaled in memory; never written to disk
  camera_face_min_height: 0.18   # a face this tall (share of frame height) = tutor camera shown large
  logo_template: assets/8x8_logo_template.png   # right-hand "8" of the 8x8 background, cut from a 1920 px frame
  logo_threshold: 0.6        # checked on 3 tutors: no-logo frames <= 0.49, logo frames 0.68-1.00 (narrow margin)
  logo_scales: [0.6, 0.75, 0.9, 1.0, 1.15, 1.3]
  static_diff: 2.0           # mean abs grey-level change below this between samples = unchanged screen
  near_black_mean: 18        # mean grey level below this = black frame (camera covered / video off)
  # Frames show children's faces and names, so they are analysed locally only. A vision model is used
  # only if named here AND offered by the provider's model list (none is on the current Groq account).
  vision_model: null

llm:
  condense_model: openai/gpt-oss-20b    # fast model: per-chunk event extraction
  judge_model: openai/gpt-oss-120b      # strongest available: final rubric judgement
  # Each Groq model has its own free-tier allowance (gpt-oss-20b: 200k tokens/day). When one is used up,
  # the next model in the list is tried, and the result says so.
  # qwen/qwen3.8-27b is NOT usable on the free tier: 1,000 output tokens/min, below one summary (~1,500).
  condense_parallel_models: [openai/gpt-oss-120b]   # extra lane: sections are summarised in parallel
  condense_fallback_models: [openai/gpt-oss-120b]
  judge_fallback_models: [openai/gpt-oss-20b]
  temperature: 0.2
  # Groq counts prompt + max_completion_tokens against the per-minute token limit, so each request
  # must fit max_request_tokens (free tier: 8000 TPM per model). Raise it on a paid tier.
  max_request_tokens: 7500
  condense_max_tokens: 2200   # replies use ~1,500; Groq counts the full allowance against tokens/min
  condense_reasoning_effort: low        # gpt-oss option; null for models that don't support it
  judge_max_tokens: 3000
  judge_reasoning_effort: medium

scoring:
  rubric: config/rubric.json
  # Weighted 0-5 score -> label. A score >= the value gets that label (highest match wins).
  # Placeholders until scripts/calibrate.py tunes them on the labelled set.
  thresholds:
    Poor: 0.0
    Average: 2.25
    Good: 3.0
    Excellent: 3.75
  # Missing-dimension policy (see scoring.py): weights of unscored dimensions are redistributed over
  # scored ones and confidence is scaled by the covered weight; below min_weight_coverage the result
  # is flagged low-confidence.
  min_weight_coverage: 0.6
  low_confidence_below: 0.5
  no_evidence_label: Poor   # label when nothing could be scored (confidence 0); see scoring.py

groq:
  base_url: https://api.groq.com/openai/v1
  requests_per_minute: 20
  max_retries: 8            # per-minute limits clear within a minute; daily limits fail fast instead
  timeout_s: 300

cache:
  read: true               # reuse results that already exist (e.g. from development runs)
  write: false             # the app never saves a new recording's transcript/results to disk;
                           # offline dataset scripts turn this on via cache.enable_writes()
  dir: data/cache          # gitignored; holds transcripts, so it stays local

logging:
  level: INFO
  log_transcript_text: false   # keep false: transcripts contain identifiable children
